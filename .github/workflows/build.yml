name: Windows build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup build environment
      uses: ./.github/actions/setup-build
    - name: Build packages
      run: node_modules/.bin/electron-builder build --win
      env:
        GH_TOKEN: ${{ secrets.github_token }}
