name: Test build

env:
  RETENTION_DAYS: 30

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup build environment
      uses: ./.github/actions/setup-build
    - name: Build packages
      run: node_modules/.bin/electron-builder build --win --publish=never
      env:
        GH_TOKEN: ${{ secrets.github_token }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: stretchly-windows-${{ github.run_id }}
        path: dist/*.*
        retention-days: ${{ env.RETENTION_DAYS }}
